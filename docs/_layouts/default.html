<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    <link rel="icon" type="image/png" href="{{ '/assets/icon-512.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/icon-512.png' | relative_url }}">
    <meta name="theme-color" content="#FDFBF7">
    <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          line-height: 1.6;
          color: #2D2D2D;
          background-color: #FDFBF7;
          max-width: 780px;
          margin: 0 auto;
          padding: 40px 24px;
        }
        .logo-header {
          margin-bottom: 24px;
        }
        .logo-header img {
          width: 84px;
          height: 84px;
          border-radius: 20px;
          object-fit: cover;
          display: block;
        }
        a {
          color: #E07A5F;
          text-decoration: none;
        }
        a:hover {
          text-decoration: underline;
        }
        hr {
          border: 0;
          border-top: 1px solid #E6E0D5;
          margin: 28px 0;
        }
        img { max-width: 100%; height: auto; }
        .play-badge {
          display: inline-flex; align-items: center; gap: 12px;
          background: #000; color: #fff; border: 1px solid #A6A6A6;
          border-radius: 10px; padding: 8px 18px 8px 14px; margin: 8px 0 16px;
        }
        .play-badge:hover { text-decoration: none; background: #1a1a1a; }
        .play-badge svg { width: 30px; height: 32px; }
        .play-badge small { display: block; font-size: 0.65rem; letter-spacing: .06em; text-transform: uppercase; line-height: 1.1; }
        .play-badge strong { display: block; font-size: 1.3rem; font-weight: 600; line-height: 1.15; }
        nav.site-nav { margin-top: 12px; font-size: 0.95rem; }
        nav.site-nav a { margin-right: 16px; }
        .site-footer {
          margin-top: 56px;
          padding-top: 28px;
          border-top: 1px solid #E6E0D5;
          text-align: center;
          color: #6E6A64;
          font-size: 0.95rem;
        }
        .site-footer img {
          width: 36px;
          height: 36px;
          margin: 0 auto 12px;
          display: block;
          object-fit: contain;
        }
    </style>
</head>
<body>
<header class="logo-header">
    <a href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/icon-512.png' | relative_url }}" alt="Manas: Aarti & Bhakti Sagar app icon" width="84" height="84">
    </a>
    <nav class="site-nav" aria-label="Main">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="https://play.google.com/store/apps/details?id=com.kalkicorp.manas">Get the app</a>
        <a href="https://github.com/kalkicorp/open-stotra-project">GitHub</a>
        <a href="{{ '/privacy-policy.html' | relative_url }}">Privacy</a>
    </nav>
</header>
<main>

{{ content }}
</main>

<footer class="site-footer">
    <img src="{{ '/assets/logo-600.png' | relative_url }}" alt="Open Stotra Project logo" width="150" loading="lazy">
    <p><em>"For love of our scripture"</em> — Kalki Corporation</p>
</footer>
</body>
</html>
