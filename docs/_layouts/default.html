<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          line-height: 1.6;
          color: #2D2D2D;
          background-color: #FDFBF7;
          max-width: 780px;
          margin: 0 auto;
          padding: 40px 24px;
        }
        .logo-header {
          margin-bottom: 24px;
        }
        .logo-header img {
          width: 84px;
          height: 84px;
          border-radius: 20px;
          object-fit: cover;
          display: block;
        }
        a {
          color: #E07A5F;
          text-decoration: none;
        }
        a:hover {
          text-decoration: underline;
        }
        hr {
          border: 0;
          border-top: 1px solid #E6E0D5;
          margin: 28px 0;
        }
        .site-footer {
          margin-top: 56px;
          padding-top: 28px;
          border-top: 1px solid #E6E0D5;
          text-align: center;
          color: #6E6A64;
          font-size: 0.95rem;
        }
        .site-footer img {
          width: 36px;
          height: 36px;
          margin: 0 auto 12px;
          display: block;
          object-fit: contain;
        }
    </style>
</head>
<body>
<div class="logo-header">
    <a href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/icon.png' | relative_url }}" alt="Manas App Logo">
    </a>
</div>

{{ content }}

<footer class="site-footer">
    <img src="{{ '/assets/logo.png' | relative_url }}" alt="The open stotra project logo" width="150">
    <p><em>"For love of our scripture"</em> — Kalki Corporation</p>
</footer>
</body>
</html>
