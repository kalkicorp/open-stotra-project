<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          line-height: 1.6;
          color: #2D2D2D;
          background-color: #FDFBF7;
          max-width: 780px;
          margin: 0 auto;
          padding: 40px 24px;
        }
        .logo-header {
          margin-bottom: 24px;
        }
        .logo-header img {
          width: 84px;
          height: 84px;
          border-radius: 20px;
          object-fit: cover;
          display: block;
        }
        a {
          color: #E07A5F;
          text-decoration: none;
        }
        a:hover {
          text-decoration: underline;
        }
        hr {
          border: 0;
          border-top: 1px solid #E6E0D5;
          margin: 28px 0;
        }
    </style>
</head>
<body>
<div class="logo-header">
    <a href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/icon.png' | relative_url }}" alt="Manas App Logo">
    </a>
</div>

{{ content }}

<div>
    <img src="docs/images/logo.png" alt="Project Screenshot" width="250">
</div>
</body>
</html>
