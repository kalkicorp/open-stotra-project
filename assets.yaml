# Category/deity display metadata for Manas's Dashboard/List screens. Keys are matched against
# the `category`/`deity` string values used across content/**/*.yaml — not folder names, same
# rule as content discovery.
#
# `nameHindi` is the bilingual caption shown under the English name; optional — a key with no
# entry (or no nameHindi field) just shows the English name alone, never a guessed translation.
#
# `image` is optional too. When present, it's full-color, high-resolution photography (see
# images/README.md). A key with no image (or a broken one) falls back to Manas's
# themed-gradient placeholder.
categories:
  - key: "Aarti"
    nameHindi: "आरती"
    image: "images/categories/aarti.jpg"
  - key: "Chalisa"
    nameHindi: "चालीसा"
