id: "hanuman_kavacham_001"
deity: "Hanuman"
category: "Kavacham"
title: "हनुमत् कवचम्"
author: "Traditional"
tags: ["hanuman kavacham", "hanumat kavacham"]
verses:
  - vId: "hk_v1"
    text: "ॐ अस्य श्रीहनुमत्कवचस्तोत्रमन्त्रस्य रामचन्द्र ऋषिः ।\nअनुष्टुप् छन्दः श्रीहनुमान् देवता ॥"
  - vId: "hk_v2"
    text: "शिरो मे रामदूतोऽव्याल्ललाटं कपिकुञ्जरः ।\nनेत्रे रक्षोविनाशी च श्रवणे मारुतात्मजः ॥"
  - vId: "hk_v3"
    text: "नासां मे गन्धमादनाधिपोऽव्यान्मुखं वरम् ।\nजिह्वां वागीश्वरोऽव्याच्च कण्ठं मे कण्ठदेशकः ॥"
