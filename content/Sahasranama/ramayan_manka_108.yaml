id: "ramayan_manka_108"
deity: "Rama"
category: "Sahasranama"
title: "रामायण मणका 108"
author: "Traditional"
tags: ["ramayan manka 108", "raghupati raghav raja ram sahasranama"]
verses:
  - vId: "rm108_v1"
    text: "रघुपति राघव राजा राम ।\nपतितपावन सीताराम ॥\nजय रघुनन्दन जय घनश्याम ।\nपतितपावन सीताराम ॥\nभीड़ पड़ी जब भक्त पुकारे ।\nदूर करो प्रभु दुःख हमारे ॥\nदशरथ के घर जन्मे राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v2"
    text: "विश्वामित्र मुनीश्वर आये ।\nदशरथ भूप से वचन सुनाये ॥\nसंग में भेजे लक्ष्मण राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v3"
    text: "वन में जाय ताड़का मारी ।\nचरण छुआए अहिल्या तारी ॥\nऋषियों के दुःख हरते राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v4"
    text: "जनक पुरी रघुनन्दन आए ।\nनगर निवासी दर्शन पाए ॥\nसीता के मन भाये राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v5"
    text: "रघुनन्दन ने धनुष चढ़ाया ।\nसब राजों का मान घटाया ॥\nसीता ने वर पाये राम ।\n-->\nपतितपावन सीताराम ॥"
  - vId: "rm108_v6"
    text: "परशुराम क्रोधित हो आये ।\nदुष्ट भूप मन में हरषाये ॥\nजनक राय ने किया प्रणाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v7"
    text: "बोले लखन सुनो मुनि ग्यानी ।\nसंत नहीं होते अभिमानी ॥\nमीठी वाणी बोले राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v8"
    text: "लक्ष्मण वचन ध्यान मत दीजो ।\nजो कुछ दण्ड दास को दीजो ॥\nधनुष तुडइय्या मैं हूं राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v9"
    text: "लेकर के यह धनुष चढ़ाओ ।\nअपनी शक्ती मुझे दिखाओ ॥\nछूवत चाप चढ़ाये राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v10"
    text: "हुई उर्मिला लखन की नारी ।\nश्रुति कीर्ति रिपुसूदन प्यारी ॥\nहुई माण्डवी भरत के बाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v11"
    text: "अवधपुरी रघुनन्दन आये ।\nघर-घर नारी मंगल गाये\nबारह वर्ष बिताये राम।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v12"
    text: "गुरु वशिष्ठ से आज्ञा लीनी ।\nराज तिलक तैयारी कीनी ॥\nकल को होंगे राजा राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v13"
    text: "कुटिल मंथरा ने बहकायी ।\nकैकई ने यह बात सुनाई ॥\nदे दो मेरे दो वरदान ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v14"
    text: "मेरी विनती तुम सुन लीजो ।\nभरत पुत्र को गदी दीजो ॥\nहोत प्रात वन भेजो राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v15"
    text: "धरनी गिरे भूप तत्काल ।\nलागा दिल में सूल विशाल ॥\nतब सुमंत बुलवाए राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v16"
    text: "राम पिता को शीश नवाए ।\nमुख से वचन कहा नहीं जाए॥\nकैकयी वचन सुनायो राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v17"
    text: "राजा के तुम प्राणों प्यारे ।\nइनके दुःख हरोगे सारे ॥\nअब तुम वन में जाओ राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v18"
    text: "वन में चौदह वर्ष बिताओ।\nरघुकुल रीति नीति अपनाओ ॥\nआगे इच्छा तुम्हरी राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v19"
    text: "सुनत वचन राघव हर्षाए ।\nमाता जी के मन्दिर आये॥\nचरण कमल में किया प्रणाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v20"
    text: "माता जी मैं तो वन जाऊं ।\nचौदह वर्ष बाद फिर आऊं ॥\nचरण कमल देखू सुख धाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v21"
    text: "सुनी शूल सम जब यह बानी ।\nभू पर गिरी कौशिला रानी ॥\nधीरज बंधा रहे श्री राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v22"
    text: "सीताजी जब यह सुन पाई।\nरंग महल से नीचे आई ॥\nकौशल्या को किया प्रणाम ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v23"
    text: "मेरी चूक क्षमा कर दीजो ।\nवन जाने की आज्ञा दीजो ॥\nसीता को समझाते राम ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v24"
    text: "मेरी सीख सिया सुन लीजो ।\nसास ससुर की सेवा कीजिए ॥\nमुझको भी होगा विश्राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v25"
    text: "मेरा दोष बता प्रभु दीजो ।\nसंग मुझे सेवा में लीजो ॥\nअर्धांगिनी तुम्हारी राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v26"
    text: "समाचार सुनि लक्ष्मण आए ।\nधनुष बाण संग परम सुहाए ॥\nबोले संग चलूंगा श्रीराम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v27"
    text: "राम लखन मिथिलेशकुमारी ।\nवन जाने की करी तैयारी ॥\nरथ में बैठ गये सुख धाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v28"
    text: "अवधपुरी के सब नर नारी ।\nसमाचार सुन व्याकुल भारी ॥\nमचा अवध में अति कोहराम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v29"
    text: "शृंगवेरपुर रघुवर आए ।\nरथ को अवधपुरी लौटाए।\nगंगा तट पर आए राम ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v30"
    text: "केवट कहे चरण धुलवाओ ।\nपीछे नौका में चढ़ जाओ\nपत्थर कर दी नारी राम ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v31"
    text: "लाया एक कठौता पानी ।\nचरण कमल धोये सुखमानी ॥\nनाव चढ़ाये लक्ष्मण राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v32"
    text: "उतराई में मुदरी दीन्हीं।\nकेवट ने यह विनती कीन्हीं ॥\nउतराई नहीं लूंगा राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v33"
    text: "तुम आए हम घाट उतारे ।\nहम आयेंगे घाट तुम्हारे ॥\nतब तुम पार लगाओ राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v34"
    text: "भरद्वाज आश्रम पर आए ।\nराम लखन ने शीष नवाए ॥\nएक रात कीन्हां विश्राम ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v35"
    text: "भाई भरत अयोध्या आए ।\nकैकई को कटु वचन सुनाए।\nक्यों तुमने वन भेजे राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v36"
    text: "चित्रकूट रघुनन्दन आए ।\nवन को देख सिया सुख पाए॥\nमिले भरत से भाई राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v37"
    text: "अवधपुरी को चलिए भाई ।\nये सब कैकई की कुटिलाई ॥\nतनिक दोष नहीं मेरा राम ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v38"
    text: "चरण पादुका तुम ले जाओ ।\nपूजा कर दर्शन फल पावो॥\nभरत को कंठ लगाए राम ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v39"
    text: "आगे चले राम रघुराया ।\nनिशाचरों को वंश मिटाया॥\nऋषियों के हुए पूरन काम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v40"
    text: "'अनसुइया' की कुटिया आये ।\nदिव्य वस्त्र सिय मां ने पाये ॥\nथा मुनि अत्री का वह धाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v41"
    text: "मुनिस्थान आए रघुराई ।\nसूर्पनखा की नाक कटाई ॥\nखरदूषन को मारे राम ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v42"
    text: "पंचवटी रघुनन्द आए ।\nकनक मृगा के संग में धाए॥\nलक्ष्मण तुम्हें बुलाते राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v43"
    text: "रावण साधु वेष में आया ।\nभूख ने मुझको बहुत सताया ॥\nभिक्षा दो यह धर्म का काम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v44"
    text: "भिक्षा लेकर सीता आई ।\nहाथ पकड़ रथ में बैठाई ॥\nसूनी कुटिया देखी राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v45"
    text: "धरनी गिरे राम रघुराई ।\nसीता के बिन व्याकुलताई ॥\nहे प्रिय सीते, चीखे राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v46"
    text: "लक्ष्मण, सीता छोड़ न आते।\nजनक दुलारी को नहीं गंवाते ॥\nबने बनाये विगड़े काम ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v47"
    text: "कोमल बदन सुहासिनि सीते ।\nतुम बिन व्यर्थ रहेंगे जीते ॥\nलगे चांदनी-जैसे घाम\nपतितपावन सीताराम ॥"
  - vId: "rm108_v48"
    text: "सुन री मैना, रे तोता ।\nसुन मैं भी पंखो वाला होता ॥\nवन वन लेता ढूँढ तमाम ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v49"
    text: "श्यामा हिरनी तू ही बता दे ।\nजनक नन्दनी मुझे मिला दे॥\nतेरे जैसी आंखें श्याम।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v50"
    text: "वन वन ढूंढ रहे रघुराई ।\nजनक दुलारी कहीं न पाई॥\nगिद्धराज ने किया प्रणाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v51"
    text: "चखचख कर फल शबरी लाई ।\nप्रेम सहित खाए रघुराई ॥\nऐसे मीठे नहीं हैं आम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v52"
    text: "विप्र रूप धरि हनुमत आए।\nचरण कमल में शीश नवाए॥\nकन्धे पर बैठाये राम।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v53"
    text: "सुग्रीव से करी मिताई ।\nअपनी सारी कथा सुनाई ॥\nबाली पहुंचाया निज धाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v54"
    text: "सिंहासन सुग्रीव बिठाया ।\nमन में वह अति ही हर्षाया ॥\nवर्षा ऋतु आई हे राम ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v55"
    text: "हे भाई लक्ष्मण तुम जाओ ।\nवानरपति को यूं समझाओ ॥\nसीता बिन व्याकुल हैं राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v56"
    text: "देश देश वानर भिजवाए ।\nसागर के सब तट पर आए ॥\nसहते भूख प्यास और घाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v57"
    text: "सम्पाती ने पता बताया ।\nसीता को रावण ले आया ॥\nसागर कूद गये हनुमानजी ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v58"
    text: "कोने कोने पता लगाया ।\nभगत विभीषन का घर पाया॥\nहनूमान ने किया प्रणाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v59"
    text: "अशोक वाटिका हनुमत आए ।\nवृक्ष तले सीता को पाए॥\nआंसू बरसे आठों याम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v60"
    text: "रावण संग निशचरी लाके ।\nसीता को बोला समझा के ॥\nमेरी ओर तो देखो बाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v61"
    text: "मन्दोदरी बना दूं दासी ।\nसब सेवा में लंका वासी ॥\nकरो भवन चलकर विश्राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v62"
    text: "चाहे मस्तक कटे हमारा ।\nमैं देखूं न बदन तुम्हारा ॥\nमेरे तन मन धन हैं राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v63"
    text: "ऊपर से मुद्रिका गिराई ।\nसीता जी ने कंठ लगाई ॥\nहनूमान जी ने किया प्रणाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v64"
    text: "मुझको भेजा है रघुराया ।\nसागर कूद यहां मैं आया ॥\nमैं हूं राम दास हनुमान ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v65"
    text: "भूख लगी फल खाना चाहूँ ।\nजो माता की आज्ञा पाऊँ ॥\nसब के स्वामी हैं श्रीराम ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v66"
    text: "सावधान होकर फल खाना ।\nरखवालों को भूल न जाना ॥\nनिशाचरों का है यह धाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v67"
    text: "हनूमान ने वृक्ष उखाड़े ।\nदेख देख माली ललकारे ॥\nमार-मार पहुंचाये धाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v68"
    text: "अक्षयकुमार को स्वर्गपहुंचाया।\nइन्द्रजीत फाँसी ले आया ॥\nब्रह्मफाँस से बंधे हनुमान ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v69"
    text: "सीता को तुम लौटा दीजो ।\nउन से क्षमा याचना कीजो ॥\nतीन लोक के स्वामी राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v70"
    text: "भगत विभीषण ने समझाया ।\nरावण ने उसको धमकाया ॥\nसनमुख देख रहे हनुमान ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v71"
    text: "रुई, तेल, घृत, वसन मंगाई ।\nपूँछ बाँध कर आग लगाई ॥\nपूँछ घुमाई है हनुमान ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v72"
    text: "सब लंका में आग लगाई ।\nसागर में जा पूँछ बुझाई॥\nहृदय कमल में राखे राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v73"
    text: "सागर कूद लौट कर आए ।\nसमाचार रघुवर ने पाए ॥\nजो मांगा सो दिया इनाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v74"
    text: "वानर रीछ संग में लाए ।\nलक्ष्मण सहित सिंधु तट आए ॥\nलगे सुखाने सागर राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v75"
    text: "सेतू कपि नल नील बनावें ।\nराम राम लिख सिला तिरावें ॥\nलंका पहुंचे राजा राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v76"
    text: "अंगद चल लंका में आया ।\nसभा बीच में पांव जमाया॥\nबाली पुत्र महा बलधाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v77"
    text: "रावण पांव हटाने आया ।\nअंगद ने फिर पांव उठाया ॥\nक्षमा करें तुझको श्री राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v78"
    text: "निशाचरों की सेना आई ।\nगरज गरज कर हुई लड़ाई ॥\nवानर बोले जय सिया राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v79"
    text: "इन्द्रजीत ने शक्ति चलाई ।\nधरनी गिरे लखन मुरझाई ॥\nचिन्ता करके रोये राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v80"
    text: "जब मैं अवधपुरी से आया ।\nहाय पिता ने प्राण गंवाया ॥\nबन में गई चुराई बाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v81"
    text: "भाई तुमने भी छिटकाया ।\nजीवन में कुछ सुख नहीं पाया ॥\nसेना में भारी कोहराम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v82"
    text: "जो संजीवनी बूटी को लाए ।\nतो भाई जीवित हो जाये ॥\nबूटी लाये तब हनुमान ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v83"
    text: "जब बूटी का पता न पाया ।\nपर्वत ही लेकर के आया ॥\nकाल नेम पहुँचाया धाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v84"
    text: "भक्त भरत ने बाण चलाया ।\nचोट लगी हनुमत लंगड़ाया ॥\nमुख से बोले जय सिया राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v85"
    text: "बोले भरत बहुत पछताकर ।\nपर्वत सहित बाण बैठाकर ॥\nतुम्हें मिला दूं राजा राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v86"
    text: "बूटी लेकर हनुमत आया ।\nलखन लाल उठ शीश नवाया ॥\nहनुमत कंठ लगाये राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v87"
    text: "कुम्भकरन उठकर तब आया।\nएक बाण से उसे गिराया ॥\nइन्द्र जीत पहुँचाया धाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v88"
    text: "दुर्गापूजन रावण कीनो ।\nनौ दिन तक आहार न लीनो ॥\nआसन बैठ किया है ध्यान ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v89"
    text: "रावण का व्रत खंडित कीना ।\nपरम धाम पहुँचा ही दीना ॥\nवानर बोले जय सिया राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v90"
    text: "सीता ने हरि दर्शन कीना ।\nचिन्ता शोक सभी तज दीना ॥\nहँस कर बोले राजा राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v91"
    text: "पहले अग्नि परीक्षा पाओ।\nपीछे निकट हमारे आओ ॥\nतुम हो पतिव्रता हे बाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v92"
    text: "करी परीक्षा कंठ लगाई ।\nसब वानर सेना हरषाई॥\nराज्य विभीषन दीन्हा राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v93"
    text: "फिर पुष्पक विमान मंगवाया ।\nसीता सहित बैठि रघुराया॥\nदण्डकवन में उतरे राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v94"
    text: "ऋषिवर सुन दर्शन को आए ।\nस्तुति कर मन में हर्षाये॥\nतब गंगा तट आये राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v95"
    text: "नन्दी ग्राम पवनसुत आए ।\nभगत भरत को वचन सुनाए ॥\nलंका से आए हैं राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v96"
    text: "कहो विप्र तुम कहां से आए ।\nऐसे मीठे वचन सुनाए॥\nमुझे मिला दो भैया राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v97"
    text: "अवधपुरी रघुनन्दन आये ।\nमन्दिर मन्दिर मंगल छाये ॥\nमाताओं को किया प्रणाम ।\nपतिल्पावन सीताराम ॥"
  - vId: "rm108_v98"
    text: "भाई भरत को गले लगाया ।\nसिंहासन बैठे रघुराया ॥\nजग ने कहा, हैं राजा राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v99"
    text: "सब भूमि विप्रो को दीन्हीं ।\nविप्रों ने वापस दे दीन्हीं ॥\nहम तो भजन करेंगे राम ।\nपतितपावन सीताराम॥"
  - vId: "rm108_v100"
    text: "धोबी ने धोबन धमकाई ।\nरामचन्द्र ने यह सुन पाई ॥\nवन में सीता भेजी राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v101"
    text: "बाल्मीकि आश्रम में आई ।\nलव व कुश हुए दो भाई ॥\nधीर वीर ज्ञानी बलवान ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v102"
    text: "अश्वमेघ यज्ञ कीन्हा राम ।\nसीता बिनु सब सूने काम ॥\nलव कुश वहाँ लियो पहचान ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v103"
    text: "सीता राम बिना अकुलाई ।\nभूमि से यह विनय सुनाई ॥\nमुझको अब दीजो विश्राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v104"
    text: "सीता भूमी माहि समाई ।\nदेखकर चिन्ता की रघुराई ॥\nबार-बार पछताये राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v105"
    text: "राम राज्य में सब सुख पावें ।\nप्रेम मग्न हो हरि गुन गावें॥\nदुःख कलेश का रहा न नाम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v106"
    text: "ग्यारह हजार वर्ष परयन्ता ।\nराज कीन्ह श्री लक्ष्मी कंता ॥\nफिर बैकुण्ठ पधारे राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v107"
    text: "अवधपुरी बैकुण्ठ सिधाई ।\nनर-नारी सबने गति पाई ॥\nशरनागत प्रतिपालक राम ।\nपतितपावन सीताराम ॥"
  - vId: "rm108_v108"
    text: "श्याम सुन्दर' ने लीला गाई ।\nमेरी विनय सुनो रघुराई ॥\nभूलूँ नहीं तुम्हारा नाम ।\nपतितपावन सीताराम ॥"
