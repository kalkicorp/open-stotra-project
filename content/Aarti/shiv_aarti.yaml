id: "shiv_aarti_001"
deity: "Shiva"
category: "Aarti"
title: "ॐ जय शिव ओंकारा"
author: "Shivanand Swami"
tags: ["shiv aarti", "jai shiv omkara", "om jai shiv omkara"]
verses:
  - vId: "sa_v1"
    text: "जय शिव ओंकारा, ॐ जय शिव ओंकारा।\nब्रह्मा विष्णु सदा शिव अर्द्धांगी धारा॥"
  - vId: "sa_v2"
    text: "एकानन चतुरानन पंचानन राजे।\nहंसानन गरुड़ासन वृषवाहन साजे॥"
  - vId: "sa_v3"
    text: "दो भुज चार चतुर्भुज दस भुज अति सोहे।\nत्रिगुण रूप निरखता त्रिभुवन जन मोहे॥"
  - vId: "sa_v4"
    text: "अक्षमाला बनमाला रुण्डमाला धारी।\nचंदन मृगमद सोहै भाले शशिधारी॥"
  - vId: "sa_v5"
    text: "श्वेताम्बर पीताम्बर बाघम्बर अंगे।\nसनकादिक गरुणादिक भूतादिक संगे॥"
  - vId: "sa_v6"
    text: "कर के मध्य कमंडलु चक्र त्रिशूल धर्ता।\nजगकर्ता जगभर्ता जगसंहारकर्ता॥"
  - vId: "sa_v7"
    text: "ब्रह्मा विष्णु सदाशिव जानत अविवेका।\nप्रणवाक्षर मध्ये ये तीनों एका॥"
  - vId: "sa_v8"
    text: "काशी में विश्वनाथ विराजत नन्दी ब्रह्मचारी।\nनित उठि भोग लगावत महिमा अति भारी॥"
  - vId: "sa_v9"
    text: "त्रिगुण शिवजी की आरती जो कोई नर गावे।\nकहत शिवानन्द स्वामी मनवांछित फल पावे॥"
