id: "hanuman_aarti_001"
deity: "Hanuman"
category: "Aarti"
title: "श्री हनुमान आरती"
author: "Traditional"
tags: ["hanuman aarti", "aarti kije hanuman lala ki"]
verses:
  - vId: "ha_v1"
    text: "आरती कीजै हनुमान लला की।\nदुष्ट दलन रघुनाथ कला की॥"
  - vId: "ha_v2"
    text: "जाके बल से गिरवर काँपे।\nरोग-दोष जाके निकट न झाँके॥\nअंजनि पुत्र महा बलदाई।\nसंतन के प्रभु सदा सहाई॥"
  - vId: "ha_v3"
    text: "दे वीरा रघुनाथ पठाए।\nलंका जारि सिया सुधि लाये॥\nलंका सो कोट समुद्र सी खाई।\nजात पवनसुत बार न लाई॥"
  - vId: "ha_v4"
    text: "लंका जारि असुर संहारे।\nसियाराम जी के काज सँवारे॥\nलक्ष्मण मुर्छित पड़े सकारे।\nलाये संजिवन प्राण उबारे॥"
  - vId: "ha_v5"
    text: "पैठि पताल तोरि जमकारे।\nअहिरावण की भुजा उखारे॥\nबाईं भुजा असुर दल मारे।\nदाहिने भुजा संतजन तारे॥"
  - vId: "ha_v6"
    text: "सुर-नर-मुनि जन आरती उतरें।\nजय जय जय हनुमान उचारें॥\nकंचन थार कपूर लौ छाई।\nआरती करत अंजना माई॥"
  - vId: "ha_v7"
    text: "जो हनुमानजी की आरती गावे।\nबसहिं बैकुंठ परम पद पावे॥\nलंक विध्वंस किये रघुराई।\nतुलसीदास स्वामी कीर्ति गाई॥"
