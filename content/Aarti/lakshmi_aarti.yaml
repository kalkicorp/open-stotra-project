id: "lakshmi_aarti_001"
deity: "Lakshmi"
category: "Aarti"
title: "ॐ जय लक्ष्मी माता"
author: "Pandit Shraddha Ram Phillauri"
tags: ["lakshmi aarti", "om jai lakshmi mata"]
verses:
  - vId: "la_v1"
    text: "ॐ जय लक्ष्मी माता, मैया जय लक्ष्मी माता।\nतुमको निसदिन सेवत, हर विष्णु विधाता॥"
  - vId: "la_v2"
    text: "उमा रमा ब्रह्माणी, तुम ही जग-माता।\nसूर्य-चंद्रमा ध्यावत, नारद ऋषि गाता॥"
  - vId: "la_v3"
    text: "दुर्गा रूप निरंजनि, सुख-सम्पत्ति दाता।\nजो कोई तुमको ध्यावत, ऋद्धि-सिद्धि धन पाता॥"
  - vId: "la_v4"
    text: "तुम पाताल-निवासिनि, तुम ही शुभदाता।\nकर्म-प्रभाव-प्रकाशिनि, भवनिधि की त्राता॥"
  - vId: "la_v5"
    text: "जिस घर तुम रहती, तहँ सब सद्गुण आता।\nसब सम्भव हो जाता, मन नहीं घबराता॥"
  - vId: "la_v6"
    text: "तुम बिन यज्ञ न होते, वस्त्र न कोई पाता।\nखान-पान का वैभव, सब तुमसे आता॥"
  - vId: "la_v7"
    text: "शुभ-गुण मंदिर सुंदर, क्षीरोदधि-जाता।\nरत्न चतुर्दश तुम बिन, कोई नहीं पाता॥"
  - vId: "la_v8"
    text: "महालक्ष्मी जी की आरती, जो कोई नर गाता।\nउर आनंद समाता, पाप उतर जाता॥"
