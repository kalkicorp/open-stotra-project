id: "narayana_aarti_001"
deity: "Narayana"
category: "Aarti"
title: "ॐ जय जगदीश हरे"
author: "Pandit Shraddha Ram Phillauri"
tags: ["narayana aarti", "vishnu aarti", "om jai jagdish hare"]
verses:
  - vId: "va_v1"
    text: "ॐ जय जगदीश हरे, स्वामी जय जगदीश हरे।\nभक्तजनों के संकट, क्षण में दूर करे॥"
  - vId: "va_v2"
    text: "जो ध्यावे फल पावे, दुःख बिनसे मनका।\nसुख-सम्पत्ति घर आवे, कष्ट मिटे तनका॥"
  - vId: "va_v3"
    text: "मात-पिता तुम मेरे, शरण गहूं मैं किसकी।\nतुम बिन और न दूजा, आस करूं जिसकी॥"
  - vId: "va_v4"
    text: "तुम पूरन परमात्मा, तुम अंतर्यामी।\nपारब्रह्म परमेश्वर, तुम सबके स्वामी॥"
  - vId: "va_v5"
    text: "तुम करुणा के सागर, तुम पालनकर्ता।\nमैं मूरख खल कामी, कृपा करो भर्ता॥"
  - vId: "va_v6"
    text: "तुम हो एक अगोचर, सबके प्राणपति।\nकिस विधि मिलूं दयामय, तुमको मैं कुमति॥"
  - vId: "va_v7"
    text: "दीनबंधु दुखहर्ता, तुम ठाकुर मेरे।\nअपने हाथ उठाओ, द्वार पड़ा तेरे॥"
  - vId: "va_v8"
    text: "विषय-विकार मिटाओ, पाप हरो देवा।\nश्रद्धा-भक्ति बढ़ाओ, संतन की सेवा॥"
