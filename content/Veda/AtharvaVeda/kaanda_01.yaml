verses:
  - vId: "av_k1_s1_v1"
    text: "मेधाजननम्।\n१-४ अथर्वा। वाचस्पतिः। अनुष्टुप्, ४ चतुष्पदा विराडुरोबृहती।\nये॑ त्रिषप्ताः प॑रि॒य॑न्ति वि॑श्वा रू॒पाणि॒ बिभ्र॑तः ।\nवा॒चस्प॒तिर्बला॒ तेषां॑ तन्वो॒ अ॒द्य द॑धातु मे ॥१॥"
  - vId: "av_k1_s1_v2"
    text: "पु॑नरे॑हि वचस्पते दे॒वेन॒ म॑नसा स॒ह।\nवसो॑ष्पते॒ नि र॑मय॒ मय्ये॒वास्तु॒ मयि॑ श्रु॒तम्॥२॥"
  - vId: "av_k1_s1_v3"
    text: "इ॒हैवाभि॑ वि त॑नू॒भे आर्त्नी॑ इव॒ ज्य॑या ।\nवा॒चस्पति॒र्नि य॑च्छतु॒ मय्ये॒वा॑स्तु॒ मयि॑ श्रु॒तम्॥३॥"
  - vId: "av_k1_s1_v4"
    text: "उ॑पहूतो वा॒चस्पति॒रुपा॒स्मान् वा॒चस्प॑तिर्ह्वयताम्।\nसं श्रु॒तेन॑ गमेमहि॒ मा श्रु॒तेन॒ वि रा॑धिषि ॥४॥"
  - vId: "av_k1_s2_v1"
    text: "रोगोपशमनम्।\nअथर्वा। पर्जन्यः(१,४ पृथिवी, ३ इन्द्रः,(चन्द्रमाश्च))। अनुष्टुप्, ३ त्रिपदा विराण्नाम गायत्री।\nवि॒द्मा श॒रस्य॑ पि॒तरं॑ प॒र्जन्यं॒ भू॑रिधायसम्।\nवि॒द्मो ष्व॑स्य मा॒तरं॑ पृथि॒वीं भूरि॑वर्पसम्॥१॥"
  - vId: "av_k1_s2_v2"
    text: "ज्याऽके॒ परि॑ णो न॒माश्मा॑नं त॒न्वं कृधि ।\nवी॒डुर्वरी॒योऽरा॑ती॒रप॒ द्वेषां॒स्याऽकृ॑धि ॥२॥"
  - vId: "av_k1_s2_v3"
    text: "वृ॒क्षं यद्गावः॑ परिषस्वजा॒ना अ॑नुस्फु॒रं श॒रमर्च॑न्त्यृ॒भुम्।\nशरु॑म॒स्मद्या॑वय दि॒द्युमि॑न्द्र ॥३॥"
  - vId: "av_k1_s2_v4"
    text: "यथा॒ द्यां च॑ पृथि॒वीं चा॒न्तस्तिष्ठ॑ति॒ तेज॑नम्।\nए॒वा रोगं॑ चास्रा॒वं चा॒न्तस्ति॑ष्ठतु॒ मुञ्ज॒ इत्॥४॥"
  - vId: "av_k1_s3_v1"
    text: "मूत्रमोचनम्।\n१-९ अथर्वा। १ पर्जन्यः, २ मित्रः, ३ वरुणः, ४ चन्द्रः, ५ सूर्यः, (१-९ मूत्रमोचनम्)। अनुष्टुप्, १-५ पथ्यापङ्क्तिः।\nवि॒द्मा श॒रस्य॑ पि॒तरं॑ प॒र्जन्यं॑ श॒तवृ॑ष्ण्यम् ।\nतेना॑ ते त॒न्वे॒३शं क॑रं पृथि॒व्यां ते॑ नि॒षेच॑नं ब॒हिष्टे॑ अस्तु॒ बालिति॑ ॥१॥"
  - vId: "av_k1_s3_v2"
    text: "वि॒द्मा श॒रस्य॑ पि॒तरं॑ मि॒त्रं श॒तवृ॑ष्ण्यम् ।\nते॑ना ते त॒न्वे॒३ शं क॑रं पृथि॒व्यां ते॑ नि॒षेच॑नं ब॒हिष्टे॑ अस्तु॒ बालिति॑ ॥२॥"
  - vId: "av_k1_s3_v3"
    text: "वि॒द्मा श॒रस्य॑ पि॒तरं॒ वरु॑णं श॒तवृ॑ष्ण्यम् ।\nतेना॑ ते त॒न्वे॒३ शं क॑रं पृथि॒व्यां ते॑ नि॒षेच॑नं ब॒हिष्टे॑ अस्तु॒ बालिति॑ ॥३॥"
  - vId: "av_k1_s3_v4"
    text: "वि॒द्मा श॒रस्य॑ पि॒तरं॑ च॒न्द्रं श॒तवृ॑ष्ण्यम् ।\nतेना॑ ते त॒न्वे॒३ शं क॑रं पृथि॒व्यां ते॑ नि॒षेच॑नं ब॒हिष्टे॑ अस्तु॒ बालिति॑ ॥४॥"
  - vId: "av_k1_s3_v5"
    text: "वि॒द्मा श॒रस्य॑ पि॒तरं॒ सूर्यं॑ श॒तवृ॑ष्ण्यम् ।\nतेना॑ ते त॒न्वे॒३ शं क॑रं पृथि॒व्यां ते॑ नि॒षेच॑नं ब॒हिष्टे॑ अस्तु॒ बालिति॑ ॥५॥"
  - vId: "av_k1_s3_v6"
    text: "यदा॒न्त्रेषु॑ गवी॒न्योर्यद्व॒स्तावधि॒ संश्रु॑तम् ।\nए॒वा ते॒ मूत्रं॑ मुच्यतां ब॒हिर्बालिति॑ सर्व॒कम्॥६॥"
  - vId: "av_k1_s3_v7"
    text: "प्र ते॑ भिनद्मि॒ मेह॑नं॒ वर्त्रं॑ वेश॒न्त्या इ॑व ।\nए॒वा ते॒ मूत्रं॑ मुच्यतां ब॒हिर्बालिति॑ सर्व॒कम्॥७॥"
  - vId: "av_k1_s3_v8"
    text: "विषि॑तं ते वस्तिबि॒लं स॑मु॒द्रस्यो॑द॒धेरि॑व ।\nए॒वा ते॒ मूत्रं॑ मुच्यतां ब॒हिर्बालिति॑ सर्व॒कम्॥८॥"
  - vId: "av_k1_s3_v9"
    text: "यथे॑षु॒का प॒राप॑त॒दव॑सृ॒ष्टाधि॒ धन्व॑नः ।\nए॒वा ते॒ मूत्रं॑ मुच्यतां ब॒हिर्बालिति॑ सर्व॒कम्॥९॥"
  - vId: "av_k1_s4_v1"
    text: "अपां भेषजम्।\n१-४ सिन्धुद्वीपः।(अपांनपात्, सोमः,) आपः। गायत्री, ४ पुरस्ताद् बृहती।\nअ॒म्बयो॑ य॒न्त्यध्व॑भिर्जा॒मयो॑ अध्वरीय॒ताम्। पृ॒ञ्च॒तीर्म॑धु॑ना॒ पयः॑ ॥१॥"
  - vId: "av_k1_s4_v2"
    text: "अ॒मूर्या उप॒ सूर्ये॒ याभि॑र्वा॒ सूर्यः॑ स॒ह। ता नो॑ हिन्वन्त्वध्व॒रम्॥२॥"
  - vId: "av_k1_s4_v3"
    text: "अ॒पो दे॒वीरुप॑ ह्वये॒ यत्र॒ गावः॒ पिब॑न्ति नः । सिन्धु॑भ्यः॒ कर्त्वं॑ ह॒विः ॥३॥"
  - vId: "av_k1_s4_v4"
    text: "अ॒प्स्व॑१न्तर॒मृत॑म॒प्सु भे॑ष॒जम्।\nअ॒पामु॒त प्रश॑स्तिभि॒रश्वा॒ भव॑थ वा॒जिनो॒ गावो॑ भवथ वा॒जिनीः॑ ॥४॥"
  - vId: "av_k1_s5_v1"
    text: "अपां भेषजम्।\n१-४ सिन्धुद्वीपः।(अपांनपात्, सोमः,) आपः। गायत्री, ४ वर्धमाना।\nआपो॒ हि ष्ठा म॑यो॒भुव॒स्ता न॑ ऊ॒र्जे द॑धातन । म॒हे रणा॑य॒ चक्ष॑से ॥१॥"
  - vId: "av_k1_s5_v2"
    text: "यो वः॑ शि॒वत॑मो॒ रस॒स्तस्य॑ भाजयते॒ह नः॑ । उ॒श॒तीरि॑व मा॒तरः॑ ॥२॥"
  - vId: "av_k1_s5_v3"
    text: "तस्मा॒ अरं॑ गमाम वो॒ यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑ ज॒नय॑था च नः ॥३॥"
  - vId: "av_k1_s5_v4"
    text: "ईशा॑ना॒ वार्या॑णां॒ क्षय॑न्तीश्चर्षणी॒नाम्। अ॒पो या॑चामि भेष॒जम्॥४॥"
  - vId: "av_k1_s6_v1"
    text: "अपां भेषजम्।\n१-४ सिन्धुद्वीपः।(अथर्वा कृतिर्वा)। (अपांनपात्,) आपः, २ आपः सोमोऽग्निश्च। गायत्री, ४ पथ्यापङ्क्तिः।\nशं नो॑ दे॒वीर॒भिष्ट॑य॒ आपो॑ भवन्तु पी॒तये॑ । शं योर॒भि स्र॑वन्तु नः ॥१॥"
  - vId: "av_k1_s6_v2"
    text: "अ॒प्सु मे॒ सोमो॑ अब्रवीद॒न्तर्विश्वा॑नि भेष॒जा।अ॒ग्निं च॑ वि॒श्वशं॑ भुवम्॥२॥"
  - vId: "av_k1_s6_v3"
    text: "आपः॑ पृणी॒त भे॑ष॒जं वरू॑थं त॒न्वे॒३ म॑म । ज्योक् च॒ सूर्यं॑ दृ॒शे॑॥३॥"
  - vId: "av_k1_s6_v4"
    text: "शं न॒ आपो॑ धन्व॒न्या॒३ शमु॑ सन्त्वनू॒प्याः ।\nशं नः॑ खनि॒त्रिमा॒ आपः॒ शमु॒ याः कु॒म्भ आभृ॑ताः शि॒वा नः॑ सन्तु॒ वार्षि॑कीः॥४॥"
  - vId: "av_k1_s7_v1"
    text: "यातुधाननाशनम्।\n१-७ चातनः। अग्निः (जातवेदाः), ३ अग्नीन्द्रौ। अनुष्टुप्, ५ त्रिष्टुप्।\nस्तु॒वा॒नम॑ग्न॒ आ व॑ह यातु॒धानं॑ किमी॒दिन॑म्।\nत्वं हि दे॑व वन्दि॒तो ह॒न्ता दस्यो॑र्ब॒भूवि॑थ ॥१॥"
  - vId: "av_k1_s7_v2"
    text: "आज्य॑स्य परमेष्ठिन् जात॑वेद॒स्तनू॑वशिन्।\nअग्ने॑ तौ॒लस्य॒ प्राशा॑न यातु॒धाना॒न् वि ला॑पय ॥२॥"
  - vId: "av_k1_s7_v3"
    text: "वि ल॑पन्तु यातु॒धाना॑ अ॒त्त्रिणो॒ ये कि॑मी॒दिनः॑ ।\nअथे॒दम॑ग्ने नो ह॒विरिन्द्र॑श्च प्रति॑ हर्यतम्॥३॥"
  - vId: "av_k1_s7_v4"
    text: "अ॒ग्नि पूर्व॒ आ र॑भतां॒ प्रेन्द्रो॑ नुदतु बाहु॒मा॑न्।\nब्रवी॑तु॒ सर्वो॑ यातु॒मान॒यम॒स्मीत्येत्य॑ ॥४॥"
  - vId: "av_k1_s7_v5"
    text: "पश्या॑म ते वी॒र्यं॒ जातवेदः॒ प्र णो॑ ब्रूहि यातु॒धाना॑न् नृचक्षः ।\nत्वया॒ सर्वे॒ परि॑तप्ताः पु॒रस्तात्त आ य॑न्तु प्रब्रुवा॒णा उपे॒दम्॥५॥"
  - vId: "av_k1_s7_v6"
    text: "आ र॑भस्व जातवेदो॒ऽस्माकार्था॑य जज्ञिषे ।\nदू॒तो नो॑ अग्ने भू॒त्वा या॑तु॒धाना॒न् वि ला॑पय ॥६॥"
  - vId: "av_k1_s7_v7"
    text: "त्व॑मग्ने यातु॒धाना॒नुप॑बद्धाँ इ॒हा व॑ह ।\nअथै॑षा॒मिन्द्रो॒ वज्रे॒णापि॑ शी॒र्षाणि॑ वृश्चतु ॥७॥"
  - vId: "av_k1_s8_v1"
    text: "यातुधाननाशनम्।\n१-४ चातनः। १-२ बृहस्पतिः, अग्नीषोमौ च, ३-४ अग्निः (जातवेदाः)। १-३ अनुष्टुप्, ४ बार्हतगर्भा त्रिष्टुप्।\nइ॒दं ह॒विर्या॑तु॒धाना॑न् न॒दी फेन॑मि॒वा व॑हत्।\nय इ॒दं स्त्री पुमा॒नक॑रि॒ह स स्तु॑वतां॒ जनः॑ ॥१॥"
  - vId: "av_k1_s8_v2"
    text: "अ॒यं स्तु॑वा॒न आग॑मदि॒मं स्म॒ प्रति॑ हर्यत ।\nबृह॑स्पते॒ वशे॑ ल॒ब्ध्वाग्नी॑षोमा॒ वि वि॑ध्यतम्॥२॥"
  - vId: "av_k1_s8_v3"
    text: "या॒तु॒धान॑स्य सोमप ज॒हि प्र॒जां नय॑स्व च ।\nनि स्तु॑वा॒नस्य॑ पातय॒ पर॒मक्ष्यु॒ताव॑रम्॥३॥"
  - vId: "av_k1_s8_v4"
    text: "यत्रै॑षामग्ने॒ जनि॑मानि॒ वेत्थ॒ गुहा॑ स॒ताम॒त्त्रिणां॑ जातवेदः ।\nतांस्त्वं ब्रह्म॑णा वावृधा॒नो ज॒ह्येऽषां शत॒तर्ह॑मग्ने ॥४॥"
  - vId: "av_k1_s9_v1"
    text: "विजयाय प्रार्थना।\n१-४ अथर्वा। १ वसवः, इन्द्रः, पूषा, वरुणः, मित्रः, अग्निः, आदित्याः, विश्वेदेवाः, २ देवाः, सूर्यः, अग्निः, हिरण्यं, ३-४ अग्निः (जातवेदाः)। त्रिष्टुप्।\nअ॒स्मिन् वसु॒ वस॑वो धारय॒न्त्विन्द्रः॑ पू॒षा वरु॑णो मि॒त्रो अ॒ग्निः ।\nइ॒ममा॑दि॒त्या उ॒त॒ विश्वे॑ च दे॒वा उत्त॑रस्मि॒न् ज्योति॑षि धारयन्तु ॥१॥"
  - vId: "av_k1_s9_v2"
    text: "अ॒स्य दे॑वाः प्र॒दिशि॒ ज्यो॑तिरस्तु॒ सूर्यो॑ अ॒ग्निरु॒त वा॒ हिर॑ण्यम्।\nस॒पत्ना॑ अ॒स्मदध॑रे भवन्तूत्त॒मं नाक॒मधि॑ रोहये॒मम्॥२॥"
  - vId: "av_k1_s9_v3"
    text: "येनेन्द्रा॑य स॒मभ॑रः॒ पयां॑स्युत्त॒मेन॒ ब्रह्म॑णा जातवेदः ।\nतेन॒ त्वम॑ग्न इ॒ह व॑र्धये॒मं स॑जा॒तानां॒ श्रैष्ठ्य॒ आ धे॑ह्येनम्॥३॥"
  - vId: "av_k1_s9_v4"
    text: "ऐषां॑ य॒ज्ञमु॒त वर्चो॑ ददे॒ऽहं रा॒यस्पोष॑मु॒त चि॒त्तान्य॑ग्ने ।\nस॒पत्ना॑ अ॒स्मदध॑रे भवन्तूत्त॒मं नाक॒मधि॑ रोहये॒मम्॥४॥"
  - vId: "av_k1_s10_v1"
    text: "पाप -विमोचनम्।\n१-४ अथर्वा। १ असुरः, २-४ वरुणः। त्रिष्टुप्, ३ ककुम्मती अनुष्टुप्, ४ अनुष्टुप्।\nअ॒यं दे॒वाना॒मसु॑रो॒ वि रा॑जति॒ वशा॒ हि स॒त्या वरु॑णस्य॒ राज्ञः॑ ।\nतत॒स्परि॒ ब्रह्म॑णा॒ शाश॑दान उ॒ग्रस्य॑ म॒न्योरुदि॒मं न॑यामि ॥१॥"
  - vId: "av_k1_s10_v2"
    text: "नम॑स्ते राजन् वरुणास्तु म॒न्यवे॒ विश्वं॒ ह्यु॒ऽग्र निचि॒केषि॑ द्रु॒ग्धम् ।\nस॒हस्र॑म॒न्यान् प्र सु॑वामि सा॒कं श॒तं जी॑वाति श॒रद॒स्तवा॒यम्॥२॥"
