    text: "कुलपा कन्या\n१-४ भृग्वङ्गिराः ।(वरुणो), यमो (वा)। अनुष्टुप्, १ ककुम्मती अनुष्टुप्, ३ चतुष्पाद्विराट्।\nभग॑मस्या॒ वर्च॒ आदि॒ष्यधि॑ वृ॒क्षादि॑व॒ स्रज॑म्।\nम॒हाबु॑ध्न इव॒ पर्व॑तो॒ ज्योक् पि॒तृष्वा॑स्ताम्॥१॥"
