  - vId: "av_k1_s29_v4"
    text: "अ॒भी॒व॒र्तो अ॑भिभ॒वः स॑पत्न॒क्षय॑णो म॒णिः ।\nरा॒ष्ट्राय॒ मह्यं॑ बध्यतां स॒पत्ने॑भ्यः परा॒भुवे॑ ॥४॥"
  - vId: "av_k1_s29_v5"
    text: "उद॒सौ सूर्यो॑ अगा॒दुदि॒दं मा॑म॒कं वचः॑ ।\nयथा॒हं श॑त्रु॒होऽसा॑न्यसपत्नः सपत्नहा॑॥५॥"
  - vId: "av_k1_s29_v6"
    text: "स॒प॒त्न॒क्षय॑णो॒ वृषा॒भिरा॑ष्ट्रो विषास॒हिः ।\nयथा॒हमे॒षां वी॒राणां॑ वि॒राजा॑नि॒ जन॑स्य च ॥६॥"
  - vId: "av_k1_s30_v1"
    text: "दीर्घायुःप्राप्तिः।\n१-४ अथर्वा (आयुष्कामः)। विश्वेदेवाः (१ वसवः, आदित्याः, १-४ देवाः)। त्रिष्टुप्, ३ शाक्वरगर्भा विराड् जगती।\nविश्वे॑ देवा॒ वस॑वो॒ रक्ष॑ते॒ममु॒तादि॑त्या जागृ॒त यू॒यम॒स्मिन्।\nमेमं सना॑भिरु॒त वा॒न्यना॑भि॒र्मेमं प्राप॒त् पौरु॑षेयो व॒धो यः ॥१॥"
  - vId: "av_k1_s30_v2"
    text: "ये वो॑ देवाः पि॒तरो॒ ये च॑ पु॒त्राः सचे॑तसो मे शृणुते॒दमु॒क्तम्।\nसर्वे॑भ्यो वः॒ प॑रि ददाम्ये॒तं स्व॒स्त्येऽनं ज॒रसे॑ वहाथ ॥२॥"
  - vId: "av_k1_s30_v3"
    text: "ये दे॑वा दि॒वि ष्ठ ये पृ॑थि॒व्यां ये अ॒न्तरि॑क्ष॒ ओष॑धीषु प॒शुष्व॒प्स्व॑१न्तः ।\nते कृ॑णुत ज॒रस॒मायु॑र॒स्मै श॒तम॒न्यान् परि॑ वृणक्तु मृ॒त्यून्॥३॥"
  - vId: "av_k1_s30_v4"
    text: "येषां॑ प्रया॒जा उ॒त वा॑नुया॒जा हु॒तभा॑गा अहु॒ताद॑श्च दे॒वाः ।\nयेषां॑ वः॒ पञ्च॑ प्र॒दिशो॒ विभ॑क्ता॒स्तान् वो अ॒स्मै स॑त्र॒सदः॑ कृणोमि ॥४॥"
  - vId: "av_k1_s31_v1"
    text: "पाशमोचनम्।\n१-४ ब्रह्मा। आशापालाः,(वास्तोष्पतिः)। अनुष्टुप्, ३ विराट् त्रिष्टुप्, ४ परानुष्टुप् त्रिष्टुप्।\nआशा॑नामाशापा॒लेभ्य॑श्च॒तुर्भ्यो॑ अ॒मृते॑भ्यः ।\nइ॒दं भू॒तस्याध्य॑क्षेभ्यो वि॒धेम॑ ह॒विषा॑ व॒यम्॥१॥"
  - vId: "av_k1_s31_v2"
    text: "य आशा॑नामाशापा॒लाश्च॒त्वार॒ स्थन॑ देवाः ।\nते नो॒ निरृ॑त्याः॒ पाशे॑भ्यो मु॒ञ्चतांह॑सो अंहसः ॥२॥"
  - vId: "av_k1_s31_v3"
    text: "अस्रा॑मस्त्वा ह॒विषा॑ यजा॒म्यश्लो॑णस्त्वा घृ॒तेन॑ जुहोमि ।\nय आशा॑नामाशापा॒लस्तु॒रीयो॑ दे॒वः स नः॑ सुभू॒तमेह व॑क्षत्॥३॥"
  - vId: "av_k1_s31_v4"
    text: "स्व॒स्ति मा॒त्र उ॒त पि॒त्रे नो॑ अस्तु स्व॒स्ति गोभ्यो॒ जग॑ते॒ पुरु॑षेभ्यः ।\nविश्वं॑ सुभू॒तं सु॑वि॒दत्रं॑ नो अस्तु॒ ज्योगे॒व दृ॑शेम॒ सूर्य॑म्॥४॥"
  - vId: "av_k1_s32_v1"
    text: "महद्ब्रह्म।\n१-४ ब्रह्मा। द्यावापृथिवी। अनुष्टुप्, २ ककुम्मत्यनुष्टुप्।\nइ॒दं ज॑नासो वि॒दथ॑ म॒हद् ब्रह्म॑ वदिष्यति ।\nन तत् पृ॑थिव्यां नो दि॒वि येन॑ प्रा॒णन्ति॑ वी॒रुधः॑ ॥१॥"
  - vId: "av_k1_s32_v2"
    text: "अ॒न्तरि॑क्ष आसां॒ स्थाम॑ श्रान्त॒सदा॑मिव ।\nआ॒स्थान॑म॒स्य भू॒तस्य॑ वि॒दुष्टद् वे॒धसो॒ न वा॑ ॥२॥"
  - vId: "av_k1_s32_v3"
    text: "यद् रोद॑सी॒ रेज॑माने॒ भूमि॑श्च नि॒रत॑क्षतम्।\nआ॒र्द्रं तद॒द्य स॑र्व॒दा स॑मु॒द्रस्ये॑व स्रो॒त्याः ॥३॥"
  - vId: "av_k1_s32_v4"
    text: "विश्व॑म॒न्याम॑भी॒वार॒ तद॒न्यस्या॒मधि॑श्रि॒तम्।\nदि॒वे च॑ वि॒श्ववे॑दसे पृथि॒व्यै चा॑करं॒ नमः॑ ॥४॥"
  - vId: "av_k1_s33_v1"
    text: "आपः।\n१-४ शन्तातिः।(चन्द्रमाः) आपः(च)। त्रिष्टुप्।\nहिर॑ण्यवर्णाः॒ शुच॑यः पाव॒का यासु॑ जा॒तः स॑वि॒ता यास्व॒ग्निः ।\nया अ॒ग्निं गर्भं॑ दधि॒रे सु॒वर्णा॒स्ता न॒ आपः॒ शं स्यो॒ना भ॑वन्तु ॥१॥"
  - vId: "av_k1_s33_v2"
    text: "यासां॒ राजा॒ वरु॑णो॒ याति॒ मध्ये॑ सत्यानृ॒ते अ॑व॒पश्य॒न् जना॑नाम्।\nया अ॒ग्निं गर्भं॑ दधि॒रे सु॒वर्णा॒स्ता न॒ आपः॒ शं स्यो॒ना भ॑वन्तु ॥२॥"
  - vId: "av_k1_s33_v3"
    text: "यासां॑ दे॒वा दि॒वि कृ॒ण्वन्ति॑ भ॒क्षं या अ॒न्तरि॑क्षे बहु॒धा भव॑न्ति ।\nया अ॒ग्निं गर्भं॑ दधि॒रे सु॒वर्णा॒स्ता न॒ आपः॒ शं स्यो॒ना भ॑वन्तु ॥३॥"
  - vId: "av_k1_s33_v4"
    text: "शि॒वेन॑ मा॒ चक्षु॑षा पश्यतापः शि॒वया॑ त॒न्वोप॑ स्पृशत॒ त्वचं॑ मे ।\nघृत॒श्चुतः॒ शुच॑यो॒ याः पा॑व॒कास्ता न॒ आपः॒ शं स्यो॒ना भवन्तु ॥४॥"
  - vId: "av_k1_s34_v1"
    text: "मधुविद्या।\n१-५ अथर्वा।मधुवनस्पतिः। अनुष्टुप्।\nइ॒यं वी॒रुन्मधु॑जाता॒ मधु॑ना त्वा खनामसि ।\nमधो॒रधि॒ प्रजा॑तासि॒ सा नो॒ मधु॑मतस्कृधि ॥१॥"
  - vId: "av_k1_s34_v2"
    text: "जि॒ह्वाया॒ अग्रे॒ मधु॑ मे जिह्वामू॒ले म॒धूल॑कम्।\nममेदह॒ क्रता॒वसो॒ मम॑ चि॒त्तमु॒पाय॑सि ॥२॥"
  - vId: "av_k1_s34_v3"
    text: "मधु॑मन्मे नि॒क्रम॑णं॒ मधु॑मन्मे प॒राय॑णम्।\nवा॒चा व॑दामि॒ मधु॑मद् भू॒यासं॒ मधु॑संदृशः ॥३॥"
  - vId: "av_k1_s34_v4"
    text: "मधो॑रस्मि॒ मधु॑तरो म॒दुघा॒न्मधु॑मत्तरः ।\nमामित् किल॒ त्वं वनाः॒ शाखां॒ मधु॑मतीमिव ॥४॥"
  - vId: "av_k1_s34_v5"
    text: "परि॑ त्वा परित॒त्नुने॒क्षुणा॑गा॒मवि॑द्विषे ।\nयथा॒ मां का॒मिन्यसो॒ यथा॒ मन्नाप॑गा॒ असः॑ ॥५॥"
  - vId: "av_k1_s35_v1"
    text: "दीर्घायुःप्राप्तिः।\n१-४ अथर्वा(आयुष्कामः)। हिरण्यम्, इन्द्राग्नी, विश्वे देवाः। जगती, ४ अनुष्टुब्गर्भा चतुष्पदा त्रिष्टुप्।\nयदाब॑ध्नन् दाक्षाय॒णा हिर॑ण्यं श॒तानी॑काय सुमन॒स्यमा॑नाः ।\nतत् ते॑ बध्ना॒म्यायु॑षे॒ वर्च॑से॒ बला॑य दीर्घायु॒त्वाय॑ श॒तशा॑रदाय ॥१॥"
  - vId: "av_k1_s35_v2"
    text: "नैनं॒ रक्षां॑सि॒ न पि॑शा॒चाः स॑हन्ते दे॒वाना॒मोजः॑ प्रथम॒जं ह्ये॒तत्।\nयो बिभ॑र्ति दाक्षाय॒णं हिर॑ण्यं॒ स जी॒वेषु॑ कृणुते दी॒र्घमायुः॑ ॥२॥"
  - vId: "av_k1_s35_v3"
    text: "अ॒पां तेजो॒ ज्योति॒रोजो॒ बलं॑ च॒ वन॒स्पती॑नामु॒त वी॒र्याऽणि ।\nइन्द्र॑ इवेन्द्रि॒याण्यधि॑ धारयामो अ॒स्मिन् तद् दक्ष॑माणो बिभर॒द्धिर॑ण्यम्॥३॥"
  - vId: "av_k1_s35_v4"
    text: "समा॑नां मा॒सामृ॒तुभि॑ष्ट्वा व॒यं सं॑वत्स॒रस्य॒ पय॑सा पिपर्मि ।\nइ॒न्द्रा॒ग्नी विश्वे॑ दे॒वास्तेऽनु॑ मन्यन्ता॒महृ॑णीयमानाः ॥४॥"
