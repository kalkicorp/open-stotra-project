  - vId: "av_k1_s16_v1"
    text: "शत्रुबाधनम्।\n१-४ चातनः। १ अग्निः, २ इन्द्रः, वरुणः, (२-४ दधत्यं सीसम्)। अनुष्टुप्, ४ ककुम्मती अनुष्टुप्।\nयेऽमावा॒स्यां॒३ रात्रि॑मु॒दस्थु॑र्व्रा॒जम॒त्त्रिणः॑ ।\nअ॒ग्निस्तु॒रीयो॑ यातु॒हा सो अ॒स्मभ्य॒मधि॑ ब्रवत्॥१॥"
