  - vId: "av_k1_s11_v4"
    text: "नेव॑ मां॒से न पीव॑सि॒ नेव॑ म॒ज्जस्वाह॑तम्।\nअवै॑तु॒ पृश्नि॒ शेव॑लं॒ शुने॑ ज॒राय्वत्त॒वेऽव॑ ज॒रायु॑ पद्यताम्॥४॥"
