  - vId: "av_k1_s15_v1"
    text: "पुष्टिकर्म।\n१-४ अथर्वा। सिन्धवः,(वाताः, पतत्रिणः)। अनुष्टुप्, १-२ भुरिक्पथ्या पङ्क्तिः।\nसं सं स्र॑वन्तु॒ सिन्ध॑वः॒ सं वाताः॒ सं प॑त॒त्रिणः॑ ।\nइ॒मं य॒ज्ञं प्र॒दिवो॑ मे जुषन्तां संस्रा॒व्येण ह॒विषा॑ जुहोमि ॥१॥"
