  - vId: "av_k1_s18_v1"
    text: "अलक्ष्मीनाशनम्।\n१-४ द्रविणोदाः। विनायकः(२ सविता, वरुणः, मित्रः, अर्यमा, देवाः, ३ सविता)। १ विराडुपरिष्टाद् बृहती, २ निचृज्जगती, ३ विराडास्तार पङ्क्तिस्त्रिष्टुप्, ४ अनुष्टुप्।\nनिर्ल॒क्ष्म्यं ऽ लला॒म्यं॑१ निररा॑तिं सुवामसि ।\nअथ॒ या भ॒द्रा तानि॑ नः प्र॒जाया॒ अरा॑तिं नयामसि ॥१॥"
  - vId: "av_k1_s18_v2"
