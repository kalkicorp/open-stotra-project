  - vId: "av_k1_s12_v1"
    text: "यक्ष्मनाशनम्।\n१-४ भृग्वङ्गिराः। यक्ष्मनाशनम्। जगती(त्रिष्टुप्), ४ अनुष्टुप्।\nज॒रा॒यु॒जः प्र॑थ॒म उ॒स्रियो॒ वृषा॒ वात॑भ्रजा स्त॒नय॑न्नेति वृ॒ष्ट्या।\nस नो॑ मृडाति त॒न्व ऋजु॒गो रु॒जन् य एक॒मोज॑स्त्रे॒धा वि॑चक्र॒मे॥१॥"
  - vId: "av_k1_s12_v2"
    text: "अङ्गे॑ अङ्गे शो॒चिषा॑ शिश्रिया॒णं न॑म॒स्यन्त॑स्त्वा ह॒विषा॑ विधेम ।\nअ॒ङ्कान्त्स॑म॒ङ्कान् ह॒विषा॑ विधेम॒ यो अग्र॑भी॒त् पर्वा॑स्या॒ ग्रभी॑ता ॥२॥"
