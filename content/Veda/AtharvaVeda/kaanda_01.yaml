  - vId: "av_k1_s17_v1"
    text: "रुधिरस्रावनिवृत्तये धमनीबन्धनम्।\n१-४ ब्रह्मा। योषितः धमन्यश्च। अनुष्टुप्, १ भुरिगनुष्टुप्, ४ त्रिपदार्षी गायत्री।\nअ॒मूर्या यन्ति॑ यो॒षितो॑ हि॒रा लोहि॑तवाससः ।\nअ॒भ्रात॑र इव जा॒मय॒स्तिष्ठ॑न्तु ह॒तव॑र्चसः ॥१॥"
