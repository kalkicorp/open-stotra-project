    text: "यः स॒पत्नो॒ योऽस॑पत्नो॒ यश्च॑ द्वि॒षन् छपा॑ति नः ।\nदे॒वास्तं सर्वे॑ धूर्वन्तु॒ ब्रह्म॒ वर्म॒ ममान्त॑रम्॥४॥"
  - vId: "av_k1_s20_v1"
    text: "शत्रुनिवारणम्।\n१-४ अथर्वा। १ सोमः, मरुतः, २ मित्रावरुणौ, ३ वरुणः ४ इन्द्रः। अनुष्टुप्, त्रिष्टुप्।\nअदा॑रसृद् भवतु देव सोमा॒स्मिन् य॒ज्ञे म॑रुतो मृ॒डता॑ नः ।\nमा नो॑ विददभि॒भा मो अश॑स्ति॒र्मा नो॑ विदद् वृजि॒ना द्वेष्या॒ या॥१॥"
  - vId: "av_k1_s20_v2"
    text: "यो अ॒द्य सेन्यो॑ व॒धोऽघा॒यूना॑मु॒दीर॑ते ।\nयु॒वं तं मि॑त्रावरुणाव॒स्मद्या॑वयतं॒ परि॑ ॥२॥"
  - vId: "av_k1_s20_v3"
    text: "इ॒तश्च॒ यद॒मुत॑श्च॒ यद् व॒धं व॑रुण यावय ।\nवि म॒हच्छर्म॑ यच्छ॒ वरी॑यो यावया व॒धम्॥३॥"
  - vId: "av_k1_s20_v4"
    text: "शा॒स इ॒त्था म॒हाँ अ॑स्यमित्रसा॒हो अ॑स्तृ॒तः ।\nन यस्य॑ ह॒न्यते॒ सखा॒ न जी॒यते॑ क॒दा च॒न॥४॥"
  - vId: "av_k1_s21_v1"
    text: "शत्रुनिवारणम्।\n१-४ अथर्वा। इन्द्रः। अनुष्टुप्।\nस्वस्ति॒दा वि॒शां पति॑र्वृत्र॒हा वि॑मृ॒धो॑ व॒शी।\nवृषेन्द्रः॑ पु॒र ए॑तु नः सोम॒पा अ॑भयंक॒रः ॥१॥"
  - vId: "av_k1_s21_v2"
    text: "वि न॑ इन्द्र॒ मृधो॑ जहि नीचा॒ य॑च्छ पृतन्य॒तः ।\nअ॒ध॒मं ग॑मया॒ तमो॒ यो अ॒स्माँ अ॑भि॒दास॑ति ॥२॥"
  - vId: "av_k1_s21_v3"
    text: "वि रक्षो॒ वि मृधो॑ जहि वि वृ॒त्रस्य॒ हनू॑ रुज ।\nवि म॒न्युमि॑न्द्र वृत्रहन्न॒मित्र॑स्याभि॒दास॑तः ॥३॥"
  - vId: "av_k1_s21_v4"
    text: "अपे॑न्द्र द्विष॒तो मनोऽप॒ जिज्या॑सतो व॒धम्।\nवि महच्छर्म॑ यच्छ॒ वरी॑यो यावया व॒धम्॥४॥"
  - vId: "av_k1_s22_v1"
    text: "हृद्रोग-कामिला-नाशनम्।\n१-४ ब्रह्मा। सूर्यो, हरिमा हृद्रोगश्च। अनुष्टुप्।\nअनु॒ सूर्य॒मुद॑यतां हृद्दयो॒तो ह॑रि॒मा च॑ ते ।\nगो रोहि॑तस्य॒ वर्णे॑न॒ तेन॑ त्वा॒ परि॑ दध्मसि ॥१॥"
  - vId: "av_k1_s22_v2"
    text: "परि॑ त्वा॒ रोहि॑तै॒र्वर्णै॑र्दीर्घायु॒त्वाय॑ दध्मसि ।\nयथा॒यम॑र॒पा अस॒दथो॒ अह॑रितो॒ भुव॑त्॥२॥"
  - vId: "av_k1_s22_v3"
    text: "या रोहि॑णीर्देव॒त्या॒३ गावो॒ या उ॒त रोहि॑णीः ।\nरू॒पंरू॑पं वयो॑वय॒स्ताभि॑ष्ट्वा॒ परि॑ दध्मसि ॥३॥"
  - vId: "av_k1_s22_v4"
    text: "शुके॑षु ते हरि॒माणं॑ रोप॒णाका॑सु दध्मसि ।\nअथो॒ हारि॑द्रवेषु ते हरि॒माणं॒ नि द॑ध्मसि ॥४॥"
  - vId: "av_k1_s23_v1"
    text: "शत्रुनिवारणम्।\n१-४ अथर्वा। वनस्पतिः(असिक्निः)। अनुष्टुप्।\nन॒क्तं॒जा॒तास्यो॑षधे॒ रामे॒ कृष्णे॒ असि॑क्नि च ।\nइ॒दं र॑जनि रजय कि॒लासं॑ पलि॒तं च॒ यत्॥१॥"
  - vId: "av_k1_s23_v2"
    text: "कि॒लासं॑ च पलि॒तं च॒ निरि॒तो ना॑शया॒ पृष॑त्।\nआ त्वा॒ स्वो वि॑शतां॒ वर्णः॒ परा॑ शु॒क्लानि॑ पातय ॥२॥"
  - vId: "av_k1_s23_v3"
    text: "असि॑तं ते प्र॒लय॑नमा॒स्थान॒मसि॑तं॒ तव॑ ।\nअसि॑क्न्यस्योषधे॒ निरि॒तो ना॑शया॒ पृष॑त्॥३॥"
  - vId: "av_k1_s23_v4"
    text: "अ॒स्थि॒जस्य॑ कि॒लास॑स्य तनू॒जस्य॑ च॒ यत् त्व॒चि।\nदूष्या॑ कृ॒तस्य॒ ब्रह्म॑णा॒ लक्ष्म॑ श्वे॒तम॑नीनशम्॥४॥"
  - vId: "av_k1_s24_v1"
    text: "शत्रुनिवारणम्।\n१-४ ब्रह्मा। आसुरी वनस्पतिः। अनुष्टुप्, २ निचृत्पथ्यापङ्क्तिः।\nसु॒प॒र्णो जा॒तः प्र॑थ॒मस्तस्य॒ त्वं पि॒त्तमा॑सिथ ।\nतदा॑सु॒री यु॒धा जि॒ता रू॒पं च॑क्रे॒ वन॒स्पती॑न्॥१॥"
  - vId: "av_k1_s24_v2"
    text: "आ॒सु॒री च॑क्रे प्रथ॒मेदं कि॑लासभेष॒जमि॒दं कि॑लास॒नाश॑नम्।\nअनी॑नशत् कि॒लासं॒ सरू॑पामकर॒त् त्वच॑म्॥२॥"
  - vId: "av_k1_s24_v3"
    text: "सरू॑पा॒ नाम॑ ते मा॒ता सरू॑पो॒ नाम॑ ते पि॒ता।\nस॒रू॒प॒कृत् त्वमो॑षधे॒ सा सरू॑पमि॒दं कृ॑धि ॥३॥"
  - vId: "av_k1_s24_v4"
    text: "श्या॒मा स॑रूपं॒कर॑णी पृथि॒व्या अध्युद्भृ॑ता ।\nइ॒दमू॒ षु प्र सा॑धय॒ पुना॑ रू॒पाणि॑ कल्पय ॥४॥"
  - vId: "av_k1_s25_v1"
    text: "ज्वर-नाशनम्।\n१-४ भृग्वङ्गिराः । यक्ष्मनाशनोऽग्निः। त्रिष्टुप्,२-३ विराड् गर्भा, ४पुरोऽनुष्टुप्।\nयद॒ग्निरापो॒ अद॑हत् प्र॒विश्य॒ यत्राकृ॑ण्वन् धर्म॒धृतो॒ नमां॑सि ।\nतत्र॑ त आहुः पर॒मं ज॒नित्रं॒ स नः॑ संवि॒द्वान् परि॑ वृङ्ग्धि तक्मन्॥१॥"
  - vId: "av_k1_s25_v2"
    text: "यद्य॒र्चि॑र्यदि॒ वासि॑ शो॒चिः श॑कल्ये॒षि यदि॑ वा ते ज॒नित्र॑म्।\nह्रूडु॒र्नामा॑सि हरितस्य देव॒ स नः॑ संवि॒द्वान् परि॑ वृङ्ग्धि तक्मन्॥२॥"
  - vId: "av_k1_s25_v3"
    text: "यदि॑ शो॒को यदि॑ वाभिशो॒को यदि॑ वा॒ राज्ञो॒ वरु॑ण॒स्यासि॑ पु॒त्रः ।\nह्रू॒डु॒र्नामा॑सि हरितस्य देव॒ स नः॑ संवि॒द्वान् परि॑ वृङ्ग्धि तक्मन्॥३॥"
  - vId: "av_k1_s25_v4"
    text: "नमः॑ शी॒ताय॑ त॒क्मने॒ नमो॑ रू॒राय॑ शो॒चिषे॑ कृणोमि ।\nयो अ॑न्ये॒द्युरु॑भय॒द्युर॒भ्येति॒ तृती॑यकाय॒ नमो॑ अस्तु त॒क्मने॑ ॥४॥"
  - vId: "av_k1_s26_v1"
    text: "शर्मप्राप्तिः।\n१-४ ब्रह्मा। १ देवाः, २ इन्द्रः, भगः, सविता, ३-४ मरुतः। गायत्री,\n२ त्रिपदा एकावसाना साम्नी त्रिष्टुप्, ४ एकावसाना पादनिचृत्।\nआ॒रे॒३साव॒स्मद॑स्तु हे॒तिर्दे॑वासो असत्। आ॒रे अश्मा॒ यमस्य॑थ ॥१॥"
  - vId: "av_k1_s26_v2"
    text: "सखा॒साव॒स्मभ्य॑मस्तु रा॒तिः सखेन्द्रो॒ भगः॑ सवि॒ता चि॒त्ररा॑धाः ॥२॥"
  - vId: "av_k1_s26_v3"
    text: "यू॒यं नः॑ प्रवतो नपा॒न्मरु॑तः॒ सूर्य॑त्वचसः । शर्म॑ यच्छाथ स॒प्रथाः॑ ॥३॥"
  - vId: "av_k1_s26_v4"
    text: "सु॒षू॒दत॑ मृ॒डत॑ मृ॒डया॑ नस्त॒नूभ्यो॒ मय॑स्तो॒केभ्य॑स्कृधि॑॥४॥"
  - vId: "av_k1_s27_v1"
    text: "स्वस्त्ययनम्।\n१-४ अथर्वा(स्वस्त्ययनकामः)। (चन्द्रमाः,) इन्द्रणी (च)। अनुष्टुप्, १ पथ्यापङ्क्तिः।\nअ॒मूः पा॒रे पृ॑दा॒क्व ऽ स्त्रिष॒प्ता निर्ज॑रायवः ।\nतासां॑ ज॒रायु॑भिर्व॒यम॒क्ष्या॒वपि॑ व्ययामस्यघा॒योः प॑रिप॒न्थिनः॑ ॥१॥"
  - vId: "av_k1_s27_v2"
    text: "विषू॑च्येतु कृन्त॒ती पिना॑कमिव॒ बिभ्र॑ती ।\nविष्व॑क् पुन॒र्भुवा॒ मनोऽस॑मृद्धा अघा॒यवः॑ ॥२॥"
  - vId: "av_k1_s27_v3"
    text: "न ब॒हवः॒ सम॑शक॒न् नार्भ॒का अ॒भि दा॑धृषुः ।\nवे॒णोरद्गा॑ इवा॒भितोऽस॑मृद्धा अघा॒यवः॑ ॥३॥"
  - vId: "av_k1_s27_v4"
    text: "प्रेतं॑ पादौ॒ प्र स्फु॑रतं॒ वह॑तं पृण॒तो गृ॒हान्।\nइ॒न्द्रा॒ण्येऽतु प्रथ॒माजी॒तामु॑षिता पु॒रः ॥४॥"
  - vId: "av_k1_s28_v1"
    text: "रक्षोघ्नम्।\n१-४ चातनः। १-२ अग्निः, ३-४ यातुधानीः। अनुष्टुप्, ३ विराट् पथ्याबृहती, ४ पथ्यापङ्क्तिः।\nउप॒ प्रागा॑द् दे॒वो अ॒ग्नी र॑क्षो॒हामी॑व॒चात॑नः ।\nदह॒न्नप॑ द्वया॒विनो॑ यातु॒धाना॑न् किमी॒दिनः॑ ॥१॥"
  - vId: "av_k1_s28_v2"
    text: "प्रति॑ दह यातु॒धाना॒न् प्रति॑ देव किमी॒दिनः॑ ।\nप्र॒तीचीः॑ कृष्णवर्तने॒ सं द॑ह यातुधा॒न्यः ॥२॥"
  - vId: "av_k1_s28_v3"
    text: "या श॒शाप॒ शप॑नेन॒ याघं मूर॑माद॒धे।\nया रस॑स्य॒ हर॑णाय जा॒तमा॑रे॒भे तो॒कम॑त्तु॒ सा॥३॥"
  - vId: "av_k1_s28_v4"
    text: "पु॒त्रम॑त्तु यातुधा॒नीः स्वसा॑रमु॒त न॒प्त्यऽम्।\nअधा॑ मि॒थो वि॑के॒श्यो॒३वि घ्न॑तां यातुधा॒न्यो॒३वि तृ॑ह्यन्तामरा॒य्यः ॥४॥"
  - vId: "av_k1_s29_v1"
    text: "राष्ट्राभिवर्धनम्, सपत्नक्षयणं च।\n१-६ वसिष्ठः। ब्रह्मणस्पतिः, अभीवर्तमणिः। अनुष्टुप्।\nअ॒भी॒व॒र्तेन॑ म॒णिना॒ येनेन्द्रो॑ अभिवावृ॒धे॑।\nतेना॒स्मान् ब्र॑ह्मणस्पते॒ऽभि रा॒ष्ट्राय॑ वर्धय ॥१॥"
  - vId: "av_k1_s29_v2"
    text: "अ॒भि॒वृत्य॑ स॒पत्ना॑न॒भि या नो॒ अरा॑तयः ।\nअभि पृ॑त॒न्यन्तं॑ तिष्ठा॒भि यो नो॑ दुर॒स्यति॑ ॥२॥"
  - vId: "av_k1_s29_v3"
