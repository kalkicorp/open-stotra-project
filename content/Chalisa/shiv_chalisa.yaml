id: "shiv_chalisa_001"
deity: "Shiva"
category: "Chalisa"
title: "श्री शिव चालीसा"
author: "Ayodhyadas"
verses:
  - vId: "sc_v1"
    text: "श्री गणेश गिरिजा सुवन, मंगल मूल सुजान।\nकहत अयोध्यादास तुम, देहु अभय वरदान॥"
  - vId: "sc_v2"
    text: "जय गिरिजा पति दीन दयाला। सदा करत सन्तन प्रतिपाला॥"
  - vId: "sc_v3"
    text: "भाल चन्द्रमा सोहत नीके। कानन कुण्डल नागफनी के॥"
  - vId: "sc_v4"
    text: "अंग गौर शिर गंग बहाये। मुण्डमाल तन छार लगाये॥"
  - vId: "sc_v5"
    text: "वस्त्र खाल बाघम्बर सोहे। छवि को देख नाग मुनि मोहे॥"
  - vId: "sc_v6"
    text: "मैना मातु की ह्वै दुलारी। बाम अंग सोहत छवि न्यारी॥"
  - vId: "sc_v7"
    text: "कर त्रिशूल सोहत छवि भारी। करत सदा शत्रुन क्षयकारी॥"
  - vId: "sc_v8"
    text: "नन्दि गणेश सोहै तहँ कैसे। सागर मध्य कमल हैं जैसे॥"
  - vId: "sc_v9"
    text: "कार्तिक श्याम और गणराऊ। या छवि को कहि जात न काऊ॥"
  - vId: "sc_v10"
    text: "देवन जबहीं जाय पुकारा। तब ही दुख प्रभु आप निवारा॥"
  - vId: "sc_v11"
    text: "किया उपद्रव तारक भारी। देवन सब मिलि तुमहिं जुहारी॥"
  - vId: "sc_v12"
    text: "तुरत षडानन आप पठायउ। लवनिमेष महँ मारि गिरायउ॥"
  - vId: "sc_v13"
    text: "आप जलंधर असुर संहारा। सुयश तुम्हार विदित संसारा॥"
  - vId: "sc_v14"
    text: "त्रिपुरासुर सन युद्ध मचाई। सबहिं कृपा कर लीन बचाई॥"
  - vId: "sc_v15"
    text: "किया तपहिं भागीरथ भारी। पुरब प्रतिज्ञा तसु पुरारी॥"
  - vId: "sc_v16"
    text: "दानिन महं तुम सम कोउ नाहीं। सेवक स्तुति करत सदाहीं॥"
  - vId: "sc_v17"
    text: "वेद नाम महिमा तव गाई। अकथ अनादि भेद नहिं पाई॥"
  - vId: "sc_v18"
    text: "प्रगट उदधि मंथन में ज्वाला। जरे सुरासुर भये विहाला॥"
  - vId: "sc_v19"
    text: "कीन्ह दया तहँ करी सहाई। नीलकण्ठ तब नाम कहाई॥"
  - vId: "sc_v20"
    text: "पूजन रामचंद्र जब कीन्हा। जीत के लंक विभीषण दीन्हा॥"
  - vId: "sc_v21"
    text: "सहस कमल में हो रहे धारी। कीन्ह परीक्षा तबहिं पुरारी॥"
  - vId: "sc_v22"
    text: "एक कमल प्रभु राखेउ जोई। कमल नयन पूजन चहं सोई॥"
  - vId: "sc_v23"
    text: "कठिन भक्ति देखी प्रभु शंकर। भये प्रसन्न दिए इच्छित वर॥"
  - vId: "sc_v24"
    text: "जय जय जय अनंत अविनाशी। करत कृपा सब के घटवासी॥"
  - vId: "sc_v25"
    text: "दुष्ट सकल नित मोहि सतावै । भ्रमत रहे मोहि चैन न आवै॥"
  - vId: "sc_v26"
    text: "त्राहि त्राहि मैं नाथ पुकारो। यहि अवसर मोहि आन उबारो॥"
  - vId: "sc_v27"
    text: "लै त्रिशूल शत्रुन को मारो। संकट से मोहि आन उबारो॥"
  - vId: "sc_v28"
    text: "मातु पिता भ्राता सब कोई। संकट में पूछत नहिं कोई॥"
  - vId: "sc_v29"
    text: "स्वामी एक है आस तुम्हारी। आय हरहु अब संकट भारी॥"
  - vId: "sc_v30"
    text: "धन निर्धन को देत सदाहीं। जो कोई जांचे वो फल पाहीं॥"
  - vId: "sc_v31"
    text: "अस्तुति केहि विधि करौं तुम्हारी। क्षमहु नाथ अब चूक हमारी॥"
  - vId: "sc_v32"
    text: "शंकर हो संकट के नाशन। मंगल कारण विघ्न विनाशन॥"
  - vId: "sc_v33"
    text: "योगी यति मुनि ध्यान लगावैं। नारद शारद शीश नवावैं॥"
  - vId: "sc_v34"
    text: "नमो नमो जय नमो शिवाय। सुर ब्रह्मादिक पार न पाय॥"
  - vId: "sc_v35"
    text: "जो यह पाठ करे मन लाई। ता पार होत है शम्भु सहाई॥"
  - vId: "sc_v36"
    text: "ॠनिया जो कोई हो अधिकारी। पाठ करे सो पावन हारी॥"
  - vId: "sc_v37"
    text: "पुत्र हीन कर इच्छा कोई। निश्चय शिव प्रसाद तेहि होई॥"
  - vId: "sc_v38"
    text: "पण्डित त्रयोदशी को लावे। ध्यान पूर्वक होम करावे ॥"
  - vId: "sc_v39"
    text: "त्रयोदशी ब्रत करे हमेशा। तन नहीं ताके रहे कलेशा॥"
  - vId: "sc_v40"
    text: "धूप दीप नैवेद्य चढ़ावे। शंकर सम्मुख पाठ सुनावे॥"
  - vId: "sc_v41"
    text: "जन्म जन्म के पाप नसावे। अन्तवास शिवपुर में पावे॥"
  - vId: "sc_v42"
    text: "कहे अयोध्या आस तुम्हारी। जानि सकल दुःख हरहु हमारी॥"
  - vId: "sc_v43"
    text: "नित्त नेम कर प्रातः ही, पाठ करौं चालीसा।\nतुम मेरी मनोकामना, पूर्ण करो जगदीश॥"
  - vId: "sc_v44"
    text: "मगसर छठि हेमन्त ॠतु, संवत चौसठ जान।\nअस्तुति चालीसा शिवहि, पूर्ण कीन कल्याण॥"
