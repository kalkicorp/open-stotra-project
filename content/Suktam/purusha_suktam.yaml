id: "purusha_suktam_001"
deity: "Narayana"
category: "Suktam"
title: "पुरुष सूक्तम्"
author: "Traditional"
tags: ["purusha suktam", "purush sukta"]
verses:
  - vId: "ps_v1"
    text: "ॐ सहस्रशीर्षा पुरुषः सहस्राक्षः सहस्रपात् ।\nस भूमिं विश्वतो वृत्वा अत्यतिष्ठद्दशाङ्गुलम् ॥"
  - vId: "ps_v2"
    text: "पुरुष एवेदं सर्वं यद्भूतं यच्च भव्यम् ।\nउतामृतत्वस्येशानो यदन्नेनातिरोहति ॥"
  - vId: "ps_v3"
    text: "एतावानस्य महिमातो ज्यायाँश्च पूरुषः ।\nपादोऽस्य विश्वा भूतानि त्रिपादस्यामृतं दिवि ॥"
