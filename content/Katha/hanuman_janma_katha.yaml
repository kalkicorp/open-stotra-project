id: "hanuman_janma_katha_001"
deity: "Hanuman"
category: "Katha"
title: "हनुमान जन्म कथा"
author: "Traditional"
tags: ["hanuman janma katha", "hanuman birth story"]
verses:
  - vId: "hjk_v1"
    text: "अंजनी माता के गर्भ से केसरी नंदन का जन्म हुआ, जिन्हें हनुमान कहा गया।\nपवनदेव के आशीर्वाद से इनमें अद्भुत बल और वायु के समान गति थी।"
  - vId: "hjk_v2"
    text: "बाल्यकाल में सूर्य को फल समझकर निगलने का प्रयत्न किया, जिससे इंद्र ने वज्र से प्रहार किया।\nइसी कारण इनकी ठुड्डी (हनु) टेढ़ी हो गई और नाम पड़ा हनुमान।"
