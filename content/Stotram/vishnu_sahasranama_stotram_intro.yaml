id: "shri_venkateswara_stotram_001"
deity: "Vishnu"
category: "Stotram"
title: "श्री वेंकटेश्वर स्तोत्रम्"
author: "Traditional"
tags: ["venkateswara stotram", "sri venkateswara stotram", "balaji stotram"]
verses:
  - vId: "vs_v1"
    text: "कमलाकुचचूचुककुङ्कुमतो \nनियतारुणितातुलनीलतनो ।\nकमलायतलोचनलोकपते \nविजयीभव वेंकटशैलपते ॥"
  - vId: "vs_v2"
    text: "सचतुर्मुखषण्मुखपञ्चमुख \nप्रमुखाखिलदैवतमौलिमणे ।\nशरणागतवत्सल सारनिधे \nपरिपालय मां वृषशैलपते ॥"
